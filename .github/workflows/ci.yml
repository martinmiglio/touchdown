name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # actions/setup-node@v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version-file: .node-version, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npx vitest run --coverage
      - name: actionlint
        # Downloads are version-pinned and fetched over TLS from the upstream release; checksum verification was deliberately not added (hashes would come from the same origin).
        run: |
          curl -sSfL -o actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color
        shell: bash
      - name: validate action.yml
        # Downloads are version-pinned and fetched over TLS from the upstream release; checksum verification was deliberately not added (hashes would come from the same origin).
        run: |
          curl -sSfL -o action-validator \
            https://github.com/mpalmer/action-validator/releases/download/v0.9.0/action-validator_linux_amd64
          chmod +x action-validator
          ./action-validator action.yml
        shell: bash

  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      # actions/checkout@v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./
        with:
          mode: deactivate
          group: ci-smoke
